
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - BOYMURODOV JAHONGIR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game">
        <h1>🐦 Flappy Bird</h1>

        <div class="scoreboard">
            <span>Hisob: <span id="score">0</span></span>
            <span>Rekord: <span id="best">0</span></span>
        </div>

        <div class="wrapper">
            <canvas id="canvas" width="400" height="600"></canvas>

            <div id="message">
                <h2>Flappy Bird</h2>
                <p>Qushni boshqar va quvurlardan o't!</p>
                <button id="startBtn">O'yinni boshlash</button>
            </div>
        </div>

        <p class="controls">
            📱 Telefon: ekranga teg<br>
            🖱️ Kompyuter: sichqonchani bos<br>
            ⌨️ Klaviatura: SPACE yoki ↑
        </p>

        <footer>
            <span>DASTUR MUALLIFI</span>
            <h2>BOYMURODOV JAHONGIR</h2>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
